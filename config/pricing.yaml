# Per-MODEL pricing. No price is ever hardcoded in Python.
#
# Prices are per `unit_tokens` tokens in `currency`. Published July 2026 list
# prices; verify before teaching, the landscape churns monthly.

currency: USD
unit_tokens: 1000000

# Used when a model has no row below, so an unknown model is never silently free.
default:
  input: 1.00
  output: 5.00

models:
  # Google
  gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
  gemini-3.1-flash: {input: 0.50, output: 3.00}
  gemini-3.1-pro: {input: 2.00, output: 12.00}
  # Open weight / hosted (the other models this gateway serves today)
  deepseek-ai/deepseek-v4-pro: {input: 0.14, output: 0.28}
  openai/gpt-oss-120b: {input: 0.15, output: 0.75}
  zai-glm-4.7: {input: 0.20, output: 0.80}
  nvidia/nemotron-3-super-120b-a12b:free: {input: 0.0, output: 0.0}
  openai/gpt-4.1: {input: 2.00, output: 8.00}
  gemma4:31b: {input: 0.0, output: 0.0}
  # Anthropic
  claude-haiku-4-5: {input: 1.00, output: 5.00}
  claude-sonnet-5: {input: 3.00, output: 15.00}
  claude-opus-5: {input: 5.00, output: 25.00}
  # OpenAI
  gpt-5.6-luna: {input: 1.00, output: 6.00}
  gpt-5.6-terra: {input: 2.50, output: 15.00}
  gpt-5.6-sol: {input: 5.00, output: 30.00}
  # Local inference costs nothing per token.
  ollama: {input: 0.0, output: 0.0}

# Cache accounting, applied when the gateway reports cache token counts.
# A cache read is billed at `cache_read_multiplier` x the input price; writing a
# cache entry is billed at `cache_write_multiplier`.
cache_read_multiplier: 0.1
cache_write_multiplier: 1.25
